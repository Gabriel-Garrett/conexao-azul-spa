<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Página Inicial - ONG Conexão Azul</title>
</head>
<body>

    <!-- LINK DE SALTO (Acessibilidade para navegação exclusiva por teclado) -->
    <a href="#conteudo-principal" class="skip-link">Saltar para o conteúdo principal</a>

    <!-- CABEÇALHO E NAVEGAÇÃO -->
    <header>
        <h1>Conexão Azul</h1>
        
        <!-- Transformado em button para foco nativo do teclado e com atributos ARIA -->
        <button class="icone-menu" id="menu-toggle" aria-expanded="false" aria-controls="menu-principal" aria-label="Abrir menu de navegação">
            &#9776;
        </button>
        
        <nav aria-label="Navegação Principal">
            <ul id="menu-principal">
                <!-- aria-current indica a página ativa para o leitor de tela -->
                <li><a href="/" data-link aria-current="page">Início</a></li>
                <li><a href="/projetos" data-link>Projetos Sociais</a>
                    <ul>
                        <li><a href="#">Robótica Inclusiva</a></li>
                        <li><a href="#">Apoio Familiar</a></li>
                    </ul>
                </li>
                <li><a href="/cadastro" data-link>Cadastro / Engajamento</a></li>
            </ul>
        </nav>
    </header>

    <!-- CONTEÚDO PRINCIPAL (aria-live avisa o leitor de tela quando o JS mudar a rota) -->
    <main id="conteudo-principal" aria-live="polite">
        <!-- O conteúdo inicial será carregado dinamicamente pelo router.js -->
    </main>

    <!-- RODAPÉ -->
    <footer>
        <p>&copy; 2026 Conexão Azul. Todos os direitos reservados.</p>
    </footer>
    
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- SCRIPT PRINCIPAL (Módulo) -->
    <script type="module" src="./js/main.js"></script>
</body>
</html>
