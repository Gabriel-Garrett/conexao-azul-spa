<section>
    <h2>Faça parte da nossa equipe</h2>
    <p>Preencha o formulário abaixo para se cadastrar como voluntário ou apoiador dos nossos projetos de robótica inclusiva.</p>
    
    <form id="form-cadastro">
        
        <fieldset>
            <legend>Dados Pessoais</legend>

            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo">
            <br><br>

            <label for="cpf">CPF (apenas números):</label>
            <input type="text" id="cpf" name="cpf" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="123.456.789-00" title="Digite o CPF no formato 123.456.789-00">
        </fieldset>
        <br>

        <fieldset>
            <legend>Contato e Endereço</legend>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required placeholder="seuemail@exemplo.com">
            <br><br>

            <label for="telefone">Telefone / WhatsApp:</label>
            <input type="tel" id="telefone" name="telefone" required pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" placeholder="(41) 99999-0000" title="Digite no formato (41) 99999-0000">
            <br><br>

            <label for="cep">CEP:</label>
            <input type="text" id="cep" name="cep" required pattern="\d{5}-\d{3}" placeholder="80000-000" title="Digite o CEP no formato 80000-000">
        </fieldset>
        <br>

        <button type="submit">Enviar Cadastro</button>

    </form>
</section>
